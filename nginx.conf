# Front proxy: the only container with a network. The app container has no
# network interface at all; nginx reaches it through a Unix socket.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Must be >= MAX_UPLOAD_KB in settings.env (plus a little form overhead).
    client_max_body_size 6m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    # ---- Real client IP -------------------------------------------------
    # Requests arrive via Nginx Proxy Manager (local HTTPS) or cloudflared
    # (Cloudflare Tunnel). Trust X-Forwarded-For only when the connection
    # comes from a private-network address (where those proxies live), and
    # take the right-most untrusted address, which a client cannot forge.
    # For tighter security replace these ranges with the exact IPs of your
    # NPM and cloudflared hosts/containers.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Keep https if the outer proxy says so.
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_status 429;

    upstream app { server unix:/run/sock/app.sock; }

    server {
        listen 8080;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 30s;

        location = /admin/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://app;
        }

        location / {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://app;
        }
    }
}
