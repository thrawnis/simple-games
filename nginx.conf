# Front proxy: the only container with a network. The app container has no
# network interface at all; nginx reaches it through a Unix socket.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Must be >= MAX_UPLOAD_KB in settings.env (plus a little form overhead).
    client_max_body_size 6m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_status 429;

    upstream app { server unix:/run/sock/app.sock; }

    server {
        listen 8080;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 30s;

        location = /admin/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://app;
        }

        location / {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://app;
        }
    }
}
